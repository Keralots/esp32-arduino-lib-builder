name: TouchDeck P4 libs

# Arduino 3.3.8 libs with only the ESP32-P4 folders rebuilt from this branch
# (CONFIG_LCD_DSI_ISR_CACHE_SAFE). Every other chip stays the released build.
# Two packages: "dsi" and "dsi-psram250" (esp32p4 PSRAM at 250 MHz, rev >= 3 only).
on:
  push:
    branches:
      - "touchdeck/**"
  workflow_dispatch:

env:
  STOCK_URL: https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz
  # Sources of the 3.3.8 libs (touchdeck/pins/versions-3.3.8.txt).
  IDF_BRANCH: release/v5.5
  IDF_TAG: v5.5.4
  AR_SOURCE_BRANCH: master
  AR_COMMIT: c6428be92c5eccb279511adf88c60f27cb2c338d
  TINYUSB_COMMIT: eae25b531d

jobs:
  build:
    name: Build ${{ matrix.target }} ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: esp32p4, variant: base }
          - { target: esp32p4_es, variant: base }
          - { target: esp32p4, variant: psram250 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: bash ./tools/prepare-ci.sh

      - name: Fetch and pin sources
        run: |
          ./tools/update-components.sh
          ./tools/install-arduino.sh
          python3 touchdeck/pin_components.py pin touchdeck/pins/${{ matrix.target }}.dependencies.lock \
            main/idf_component.yml components/arduino/idf_component.yml

      - name: PSRAM at 250 MHz
        if: matrix.variant == 'psram250'
        run: |
          sed -i 's/^CONFIG_SPIRAM_SPEED_200M=y$/CONFIG_SPIRAM_SPEED_250M=y/' configs/defconfig.80m_200m configs/defconfig.40m_200m
          grep -H SPIRAM_SPEED configs/defconfig.80m_200m configs/defconfig.40m_200m

      - name: Build
        run: |
          source ./tools/install-esp-idf.sh
          ./build.sh -s -e -t ${{ matrix.target }}

      - name: Check component versions against the release
        run: |
          python3 touchdeck/pin_components.py check \
            out/tools/esp32-arduino-libs/${{ matrix.target }}/dependencies.lock \
            touchdeck/pins/${{ matrix.target }}.dependencies.lock

      - name: Upload build on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.target }}-${{ matrix.variant }}
          path: build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libs-${{ matrix.target }}-${{ matrix.variant }}
          path: dist

  combine:
    name: Combine with the released libs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: dist
          pattern: libs-*

      - name: Build the packages
        run: |
          set -euo pipefail
          curl -sSLf "$STOCK_URL" -o stock.tar.xz
          bash touchdeck/combine.sh stock.tar.xz dsi \
            dist/libs-esp32p4-base dist/libs-esp32p4_es-base
          bash touchdeck/combine.sh stock.tar.xz dsi-psram250 \
            dist/libs-esp32p4-psram250 dist/libs-esp32p4_es-base

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: touchdeck-libs
          path: |
            esp32-core-3.3.8-libs-*.tar.xz
            esp32-core-3.3.8-libs-*.tar.xz.sha256
          compression-level: 0
